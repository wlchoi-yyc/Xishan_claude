name: Deploy Xishan Claude to Firebase Hosting

on:
  push:
    branches:
      - claude/liu-zongyuan-interactive-game-kjvvpm

permissions:
  contents: read
  id-token: write

concurrency:
  group: xishan-claude-hosting
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          project_id: mulan-journey
          workload_identity_provider: projects/733094425911/locations/global/workloadIdentityPools/xishan-claude/providers/github
          service_account: xishan-claude-deploy@mulan-journey.iam.gserviceaccount.com
          token_format: access_token
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Deploy only the Xishan Claude site
        run: npx --yes firebase-tools@15.31.0 deploy --only hosting --project mulan-journey --non-interactive
