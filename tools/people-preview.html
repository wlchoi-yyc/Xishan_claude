<!doctype html>
<html><head><meta charset="utf-8"><title>人物預覽</title>
<style>html,body{margin:0;height:100%;background:#cfd8d4;overflow:hidden}#gl{position:fixed;inset:0;width:100%;height:100%}#markers,#tooltip{display:none}#info{position:fixed;left:8px;top:8px;font:14px sans-serif;color:#333}</style></head>
<body><canvas id="gl"></canvas><div id="markers"></div><div id="tooltip"></div><div id="dpad"></div><div id="info"></div>
<script type="module">
// 開發用：人物造型預覽。?view=lineup|face|poses|walk  &t=秒
import { THREE, E } from '../js/engine.js';
import { makePerson } from '../js/people.js';
import * as world from '../js/world.js';
const q = new URLSearchParams(location.search);
const view = q.get('view') || 'lineup';
const renderer = E.renderer;
const { scene } = world.baseScene({ fogNear: 200, fogFar: 900 });
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 40), new THREE.MeshLambertMaterial({ color: '#8a8a6a' }));
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true; scene.add(ground);
const cam = new THREE.PerspectiveCamera(30, innerWidth / innerHeight, 0.05, 2000);
const people = [];
function add(preset, x, z = 0, ry = 0, extra = {}) {
  const p = makePerson(Object.assign({ preset }, extra)); p.position.set(x, 0, z); p.rotation.y = ry; scene.add(p); people.push(p); return p;
}
const presets = ['liu', 'servant', 'oldServant', 'friend1', 'friend2', 'boatman', 'student'];
if (view === 'lineup') {
  presets.forEach((k, i) => add(k, (i - 3) * 0.95, 0, -0.35));
  cam.position.set(0.6, 1.25, 8.2); cam.lookAt(0, 0.9, 0);
} else if (view === 'back') {
  presets.forEach((k, i) => add(k, (i - 3) * 0.95, 0, Math.PI - 0.5));
  cam.position.set(0.6, 1.25, 8.2); cam.lookAt(0, 0.9, 0);
} else if (view === 'face') {
  add(q.get('p') || 'liu', 0, 0, 0.35);
  cam.position.set(0, 1.62, 1.05); cam.lookAt(0, 1.64, 0);
} else if (view === 'faces') {
  ['liu', 'servant', 'oldServant', 'boatman', 'friend1', 'friend2'].forEach((k, i) => add(k, (i - 2.5) * 0.5, 0, 0.15));
  cam.position.set(0, 1.62, 3.3); cam.lookAt(0, 1.62, 0);
} else if (view === 'poses') {
  const a = add('liu', -1.6, 0, 0.4); a.userData.setPose('sit');
  const b = add('servant', -0.2, 0, 0.3); b.userData.setPose('sit');
  const c = add('liu', 1.4, -0.4, 1.2); c.userData.setPose('lie');
  const d = add('liu', 2.6, 0, -0.5, { name: '柳宗元' }); d.userData.holdCup(world.makeCup(), { lift: -0.02, rim: 0.035 }); d.userData.drinkPose(2);
  cam.position.set(0.4, 2.2, 7); cam.lookAt(0.4, 0.6, 0);
} else if (view === 'drink') {
  // ?view=drink&k=0..2&sit=1&ang=
  const k = parseFloat(q.get('k') || '2'), ang = parseFloat(q.get('ang') || '0.6');
  const d = add(q.get('p') || 'liu', 0, 0, ang, { name: '柳宗元' });
  if (q.get('sit')) d.userData.setPose('sit');
  if (q.get('pot')) { const pt = world.makeWinePot('#7a8a70'); pt.scale.setScalar(0.5); d.userData.holdCup(pt, { lift: -0.13, rim: 0.08 }); } else d.userData.holdCup(world.makeCup(), { lift: -0.025, rim: 0.03 }); d.userData.drinkPose(k);
  const y = q.get('sit') ? 0.95 : 1.5;
  cam.position.set(0, y + 0.1, 1.9); cam.lookAt(0, y - 0.05, 0);
  if (q.get('zoom')) { d.updateMatrixWorld(true); const g = new THREE.Vector3(); d.userData.armR.userData.grip.getWorldPosition(g); cam.position.set(g.x + 0.12, g.y + 0.12, g.z + 0.5); cam.lookAt(g); }
} else if (view === 'walk') {
  ['liu', 'servant', 'boatman'].forEach((k, i) => { const p = add(k, (i - 1) * 1.1, 0, Math.PI / 2 - 0.3); p.userData.walking = true; });
  cam.position.set(0, 1.2, 6); cam.lookAt(0, 0.85, 0);
}
cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix();
const sun = scene.children.find(o => o.isDirectionalLight);
if (sun) { sun.castShadow = true; sun.shadow.normalBias = 0.05; sun.shadow.mapSize.set(2048, 2048); Object.assign(sun.shadow.camera, { left: -6, right: 6, top: 6, bottom: -6 }); sun.shadow.camera.updateProjectionMatrix(); }
people.forEach(p => p.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } }));
if (q.get('ghost')) people.forEach(p => p.traverse(o => { if (o.material) { o.material = o.material.clone(); o.material.transparent = true; o.material.opacity = 0.75; } }));
E.speaker = q.get('talk') || '';
// 以固定步長推進動畫，方便截圖
const T = parseFloat(q.get('t') || '1.3');
for (let i = 0; i < T * 60; i++) people.forEach(p => p.userData.update(1 / 60));
if (sun) { sun.position.set(40, 60, 50); sun.target.position.set(0, 0, 0); scene.add(sun.target); }
renderer.setPixelRatio(1); renderer.setSize(innerWidth, innerHeight);
renderer.setAnimationLoop(null);
renderer.render(scene, cam);
window.__ready = true;
</script></body></html>
